# powerlink-pilot 키워드 설정 예시
#
# 가장 쉬운 시작:
#   1) `python -m powerlink_pilot setup` 실행 → 자동 생성됨 (실 모드)
#   2) 수동 작성하려면 이 파일을 keywords.yaml 로 복사 후 편집
#
# 모드별 사용법:
#   샘플(시뮬):  python -m powerlink_pilot run --sample --config keywords.yaml
#   드라이런:    python -m powerlink_pilot run --dry-run     (실 API, 변경 X)
#   라이브:      python -m powerlink_pilot run --live        (실제 입찰 변경)
#
# 필드 설명:
#   target_rank — 목표 순위 (1=최상단, 1~10)
#   max_bid     — 최대 입찰가 (원, 절대 넘지 않을 금액)
#   min_bid     — 최소 입찰가 (원, 너무 낮아져 노출 0이 되는 걸 막는 안전선)
#   step        — 1회 조정 단위 (원)

# 관리할 광고그룹 (실 모드에서 필수, 샘플 모드에선 무시됨)
# setup 마법사가 자동으로 채워줍니다. 수동 작성 시 본인 광고 계정의 그룹 ID 입력.
adgroups:
  - id: "grp-a001-01-XXXXXXXXXXXXXXX"
    name: "예시광고그룹_1"

# 모든 키워드에 공통으로 적용. 각 키워드에서 override 가능.
defaults:
  target_rank: 3
  max_bid: 10000
  min_bid: 100
  step: 500

keywords:
  # 가장 단순한 형태 (defaults 그대로 사용)
  - name: 예시키워드_1

  # 일부만 override
  - name: 예시키워드_2
    target_rank: 2
    max_bid: 16000

  # 전체 override
  - name: 예시키워드_3
    target_rank: 4
    max_bid: 8000
    min_bid: 2000
    step: 800
