[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "powerlink-pilot"
version = "0.3.0"
description = "Open-source Naver Search Ads auto-bidding + search query analyzer + negative keyword finder"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "kimtaedaeri" },
]
keywords = ["naver", "search-ads", "powerlink", "bidding", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/kimtaedaeri/naver-powerlink-bidding"
Repository = "https://github.com/kimtaedaeri/naver-powerlink-bidding"
Issues = "https://github.com/kimtaedaeri/naver-powerlink-bidding/issues"

[project.scripts]
powerlink-pilot = "powerlink_pilot.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["powerlink_pilot*"]
